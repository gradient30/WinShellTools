[package]
name = "devshelltools-studio"
version = "1.0.5"
description = "DevShellTools 便携管理工具"
authors = ["DevShellTools"]
repository = "https://repo.mvp.edu.kg/QAS/WinShellTools.git"
edition = "2021"
rust-version = "1.77"

[lib]
name = "devshelltools_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = ["devtools"] }
tauri-plugin-fs = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
chrono = "0.4"
# M3：AI 集成。reqwest 已作为 tauri 间接依赖在缓存中（0.12.28）。
# 流式响应用 reqwest 内置 response.bytes_stream()，无需 eventsource-stream。
# 凭证改用文件加密存储（.studio/config.json），避免引入 keyring crate。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# M4 再加入：zip

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
